[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-detect"
version = "0.0.14"
description = "Module that determines a host's cloud provider"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Daniel Gonzalez Lopes", email = "danielgonzalezlopes@gmail.com" },
]
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.13",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/dgzlopes/cloud-detect"
Repository = "https://github.com/dgzlopes/cloud-detect"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "aresponses>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "Q", "T10"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
force-single-line = true
